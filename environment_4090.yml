name: sgxl
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.9
  - pip
  - pytorch::pytorch=2.0.1
  - pytorch::torchvision=0.15.2
  - pytorch::pytorch-cuda=11.8
  - numpy
  - click
  - pillow
  - scipy
  - requests
  - tqdm
  - ninja
  - matplotlib
  - imageio
  - dill
  - psutil
  - regex
  - pip:
    - imgui==1.3.0
    - glfw==2.2.0
    - pyopengl==3.1.5
    - imageio-ffmpeg==0.4.3
    - pyspng
    - ftfy==6.1.1
    - timm==0.4.12
